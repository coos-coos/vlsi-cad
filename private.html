<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f4ea">
  <meta name="robots" content="noindex,nofollow">
  <title>Private · VLSI Design Academy</title>
  <style>
    :root{--paper:#f7f4ea;--card:#fffdf6;--ink:#151510;--lime:#d8ff4f;--coral:#ff684a;--pink:#ff78b8;--blue:#5268ff;--sans:"Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;--hand:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;--mono:"SFMono-Regular",Consolas,monospace;--bounce:cubic-bezier(.2,1.55,.35,1)}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
    body:before{content:"";position:fixed;inset:0;z-index:-1;background-image:radial-gradient(rgba(21,21,16,.3) .45px,transparent .45px);background-size:10px 10px;opacity:.2}
    main{width:min(760px,100%)}
    h1{margin:0 0 30px;text-align:center;font:600 clamp(3.6rem,11vw,7rem)/.9 var(--hand);letter-spacing:-.055em}
    nav{display:grid;gap:20px}
    a{--accent:var(--lime);min-height:112px;padding:24px 30px;display:flex;align-items:center;justify-content:space-between;gap:24px;border:1.5px solid var(--ink);border-radius:24px 14px 27px 17px;background:var(--card);color:var(--ink);box-shadow:7px 8px 0 var(--ink);font-size:clamp(1.25rem,3vw,1.7rem);font-weight:950;text-decoration:none;transition:transform .35s var(--bounce),box-shadow .35s var(--bounce),background .25s ease}
    a:nth-child(2){--accent:var(--pink)}
    a:nth-child(3){--accent:var(--blue)}
    a:after{content:"↗";width:48px;height:48px;flex:none;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;background:var(--accent);font-size:1.5rem;transition:transform .35s var(--bounce)}
    a:hover{background:color-mix(in srgb,var(--accent) 18%,var(--card));box-shadow:11px 13px 0 var(--ink);transform:translateY(-5px) rotate(-.25deg)}
    a:hover:after{transform:translate(4px,-4px) rotate(8deg)}
    a:focus-visible{outline:3px solid var(--coral);outline-offset:6px}
    @media(max-width:520px){a{min-height:92px;padding:20px}}
    @media(prefers-reduced-motion:reduce){a,a:after{transition:none}}
  </style>
</head>
<body>
  <main>
    <h1>Private</h1>
    <nav aria-label="Private links">
      <a href="https://dapper-semolina-f76fb6.netlify.app/">Private trip plan</a>
      <a href="https://comforting-jalebi-63dae4.netlify.app/">Alpine lodges</a>
      <a href="https://reliable-stroopwafel-55c0a9.netlify.app/">Waheeda</a>
    </nav>
  </main>
</body>
</html>
