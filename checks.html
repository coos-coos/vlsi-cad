paths:{
number:'07',title:'Path analysis & enumeration',accent:'Find the real worst path.',color:'#a77bff',time:'50-60 min',level:'Graph algorithms → signoff PBA',
deck:'Propagate early/late arrival and required time, enumerate N-worst paths without listing an exponential set, read reports correctly, and remove GBA/clock pessimism.',
objectives:['Perform forward/backward timing propagation for max and min analysis','Explain bounded N-worst enumeration and path-group reporting','Separate GBA, CRPR and PBA sources of pessimism'],
map:['AT/RAT','N-worst','CRPR','PBA'],
sections:[
S('Path taxonomy and groups','A timing path is an ordered arc sequence between a legal startpoint and endpoint under a check.',
['Data paths are input-to-register, register-to-register, register-to-output and input-to-output. Clock paths travel from clock roots to sequential pins; gating, recovery/removal and data-check paths form specialized categories. Unconstrained paths have legal topology but no applicable temporal requirement.','Path groups partition optimization and reporting, commonly by endpoint clock. Without groups, one badly failing domain can dominate optimization while another receives little attention. group_path can form architecture-specific groups, but excessive groups can distort optimization effort.'],
['Startpoint: input port or sequential launch clock pin.','Endpoint: output port or constrained sequential data/control pin.','Through points restrict the arc sequence.'],
'path = startpoint + ordered cell/net arcs + endpoint check',
'report_timing -from SRC -through MUX/I0 -to DST\ngroup_path -from SRC -to DST -name CORE',
'A report path is not simply “a chain of cells”; it includes launch/capture clock context and the endpoint check.'),
S('Forward arrival propagation','Graph analysis retains the worst state at each node rather than every complete path.',
['For max/setup analysis, arrival at a node is the maximum of predecessor arrival plus arc delay. For min/hold, it is the minimum. Separate rise/fall states follow timing sense, and early/late corner states select appropriate delays. Topological order gives linear-time propagation in graph size.','The predecessor that wins a merge records a critical traceback. But delay depends on slew. One predecessor may produce later arrival while another produces worse slew and a larger downstream delay; GBA conservatively merges states or retains multiple tags to avoid optimism.'],
['Max AT merge: max.','Min AT merge: min.','Transition and clock/path tags complicate a scalar merge.'],
'ATmax(v)=maxu[ATmax(u)+d(u,v)] ; ATmin(v)=minu[ATmin(u)+d(u,v)]',
'A=1.2+0.8=2.0\nB=1.6+0.2=1.8\nmax arrival at merge = 2.0 via A',
'The locally latest arrival is not always the globally worst path when downstream delay depends on the merged slew.'),
S('Backward required-time propagation','Requirements flow opposite to data and select the most restrictive successor.',
['Endpoint required time is built from the capture edge, capture latency, uncertainty and library check. For max analysis, required time at a predecessor is the minimum of successor required minus arc delay. For min analysis, the most restrictive operation is inverted: required states reflect the largest early boundary according to the tool’s convention.','Slack at an endpoint decides the check. Internal slack is useful for reporting and optimization, but it represents the worst path passing through the node and may combine a forward state with a backward state that do not form one realizable path—another source of GBA pessimism.'],
['Max slack = RAT − AT.','Min slack commonly reported = AT − RAT.','Internal slack guides criticality but needs path reconstruction.'],
'RATmax(v)=minw[RATmax(w)−d(v,w)]',
'endpoint RAT=5.0; arc to endpoint=0.7 → predecessor RAT=4.3',
'Always identify whether a report is max/setup or min/hold before interpreting subtraction signs.'),
S('Enumerating N worst without enumerating all','The number of topological paths can be exponential even when graph propagation is linear.',
['After finding the critical path, “onion peeling” one fix at a time is inefficient. N-worst enumeration uses bounds. For each node, compute the maximum possible continuation to a synthetic sink. A partial path’s current length plus this bound estimates the best full path it can become. A priority queue expands the most promising candidates; once the requested N complete paths dominate all remaining bounds, search stops.','Reporting controls distinguish N worst per endpoint from total maximum paths. Multiple nearly identical paths can share most arcs, and path groups prevent one domain from consuming the entire list. Endpoint-based WNS/TNS summaries usually count only each endpoint’s worst violation.'],
['Dynamic-programming continuation bound.','Best-first expansion / pruning.','nworst and max_paths control different multiplicities.'],
'upper_bound(partial)=length_so_far+longest_remaining(node)',
'report_timing -nworst 3 -max_paths 30',
'A list of 100 paths is not “all critical logic”; inspect endpoint and group diversity.'),
S('Common-path pessimism removal','A physically common clock segment cannot simultaneously take incompatible early and late delays for one event.',
['Launch and capture clock trees may share circuitry until a point of divergence. OCV analysis can assign late delay to the common portion on one side and early delay on the other, even though it is the same hardware carrying the same transition. CPP is the late-minus-early difference at the common point; CRPR/CPPR credits back the impossible difference.','Reconvergent clock mux topology complicates the common point. Tools choose a topologically safe common pin across legal paths, not merely the visually nearest shared segment. Transition mismatch policy may require same-polarity propagation before granting credit. General CRP also covers mutually exclusive clock paths whose simultaneous conditions cannot occur.'],
['POD/common point ends shared propagation.','Setup credit relaxes required time; hold credit is applied with the corresponding sign.','Case analysis and clock-mode legality affect reconvergence proof.'],
'CPP = latest common-point arrival − earliest common-point arrival',
'set timing_remove_clock_reconvergence_pessimism true',
'CRPR removes impossible analysis pessimism; it must not erase real variation on separate branches.'),
S('GBA versus PBA','Fast graph merging is ideal for coverage; path-specific repropagation is ideal for final truth on a small set.',
['GBA merges worst slew, variation depth, crosstalk windows and required/arrival states at nodes. The resulting combination can be more pessimistic than any realizable complete path. PBA takes a concrete path and recomputes its slew, cell/net delays, variation and SI alignment in path context. Therefore PBA slack can only improve relative to the corresponding GBA path.','Path mode recalculates the GBA-selected paths but does not guarantee they remain the worst after improvements. Exhaustive PBA evaluates enough candidates to prove the reported N are the worst recalculated paths. It stops when unrecalculated paths’ GBA slack cannot beat the current PBA set because PBA only improves slack.'],
['GBA: whole-design screening and optimization.','PBA path mode: fast estimate of recoverable pessimism.','PBA exhaustive: signoff-quality worst-path ordering, higher runtime.'],
'slackPBA(path) ≥ slackGBA(path)',
'report_timing -nworst 2 -pba_mode path\nreport_timing -nworst 2 -pba_mode exhaustive',
'PBA is not a substitute for fixing real delay; it separates real violations from incompatible graph-level worst cases.')
],
labTitle:'GBA/PBA path enumerator',labIntro:'Switch max/min and GBA/PBA, inspect three reconvergent candidates, adjust a shared slew penalty and see critical ordering and slack change.',
quiz:[
['For max analysis, which arrival survives a simple fan-in merge?',['Latest','Earliest','Average'],0,'Setup analysis seeks the latest data arrival.'],
['Why may exhaustive PBA evaluate more paths than it reports?',['It must prove unrecalculated candidates cannot become worse after path-specific improvement','It randomly samples','It deletes clocks'],0,'GBA bounds and the fact that PBA only improves slack let the search stop safely.'],
['What physical contradiction does CRPR target?',['Different early/late delay assigned to the same common clock circuitry','Different data functions','Different output loads'],0,'One common segment carrying one event cannot be simultaneously early and late.']
],
refs:[['WNS / TNS / NUM','Worst slack, sum of negative endpoint slacks, violating endpoint count.'],['N-worst','Bounded path enumeration over an exponential path space.'],['CRPR','Common/reconvergent clock pessimism credit.'],['PBA','Path-specific repropagation of slew, variation and SI.']]
},
variation:{
number:'08',title:'Variation handling',accent:'Model distributions, not fear.',color:'#ffdb45',time:'55-65 min',level:'Corners → OCV → POCV',
deck:'Separate global and local variation, understand correlation and pessimism, compare flat/depth-aware/statistical approaches, and interpret sigma-based path timing and yield.',
objectives:['Classify global/local, random/systematic, spatial/structural variation','Predict OCV and AOCV early/late behavior for setup and hold','Compute correlated path sigma and explain POCV/LVF limitations'],
map:['Corners','OCV/AOCV','SSTA','POCV/LVF'],
sections:[
S('Variation has structure','Process, voltage and temperature are not independent random knobs applied identically everywhere.',
['Global inter-die variation shifts much of a die together. Local on-die variation differentiates nearby devices. Random sources tend to average with path depth; systematic voltage/temperature and spatial process fields create correlation. Structural correlation arises when reconvergent paths share arcs or underlying variables.','A “total corner” that makes every transistor a simultaneous 3σ worst device combines global and local extremes and becomes overly pessimistic as local variation grows. Modern methodology uses global libraries/corners for die-level conditions and lets STA model on-die variation.'],
['Global: correlated chip/wafer shift.','Local random: mismatch between nominally similar devices.','Spatial: nearby objects share systematic variation.','Structural: paths share cells/nets or reconverge.'],
'Var(ΣXi)=Σσi²+2Σi<j Cov(Xi,Xj)',
'ρ=0 → sigma grows ~√N\nρ=1 → sigma grows ~N',
'Correlation decides whether variation averages or accumulates; sigma alone is insufficient.'),
S('Multi-corner analysis covers global conditions','Foundry views sample extreme process, voltage, temperature and interconnect conditions.',
['Cell libraries are supplied for process corners such as SS/TT/FF and voltage/temperature combinations. Slow setup corners often combine slow process, low voltage and a temperature that maximizes delay; fast hold corners use the opposite, but temperature inversion means simplistic “hot is slow” rules can fail.','Interconnect views may include typical, Cbest/Cworst and RCbest/RCworst. Assuming all metal layers move together is tractable but correlated; real layer variation can be mixed. Enumerating four dominant states across fifteen layers would be 4^15 combinations, so statistical/derate approaches replace brute-force mixed corners.'],
['Cell PVT and parasitic corner must form a physically meaningful scenario.','Multiple Vt flavors may not track perfectly.','Setup and hold worst scenarios can differ by path composition.'],
'scenario count grows as product of independent corner choices',
'slow setup ≠ always SS, low V, hot; validate with characterized technology behavior',
'MCMM pruning is useful only if it cannot discard a real worst scenario for the path class.'),
S('Flat OCV: early and late worlds','Derates create a min/max envelope inside one global corner.',
['set_timing_derate applies early factors below nominal and late factors above nominal. Worst setup makes launch clock and data late, while capture clock is early. Worst hold makes launch clock and data early, while capture clock is late. Applying opposite derates to a common clock segment creates common-path pessimism that CRPR removes.','Flat OCV is robust and simple but assumes every stage takes the same extreme. Ten cells each ranging 90–100 ps are analyzed as 900 or 1000 ps, although real random mismatch is unlikely to align every cell at one bound. Deep paths are therefore over-derated.'],
['Setup: late launch/data, early capture.','Hold: early launch/data, late capture.','Clock/data/cell/net derates may be controlled separately.'],
'dearly = dnom·kearly; dlate = dnom·klate',
'set_timing_derate -early 0.92\nset_timing_derate -late 1.04',
'Flat OCV encodes conservatism, not a literal probability distribution.'),
S('AOCV uses depth and distance','Random mismatch averages with stage count; systematic variation grows with spatial separation.',
['AOCV tables index derate by logical depth and sometimes physical distance. Shallow paths get larger random derates; deep paths get smaller ones. Cells distributed over a wide region may receive larger systematic derates than tightly clustered cells. Separate tables can exist by cell, transition, early/late and delay type.','In GBA, a shared gate can inherit the shallowest/worst depth from one path and contaminate a long path. PBA recomputes actual path depth, often recovering pessimism. AOCV is still table-based heuristic: it compresses correlations into depth/distance rather than propagating explicit random variables.'],
['Depth approximates random averaging.','Distance approximates systematic correlation.','Path-specific depth matters at reconvergence.'],
'random relative sigma ~1/√N for independent equal stages',
'depth 1: late derate 1.214\ndepth 5: late derate 1.056',
'AOCV improvement is not uniform; short paths can remain strongly derated and dominate hold.'),
S('Statistical STA and Monte Carlo','SSTA propagates distributions and dependency rather than selected scalar extremes.',
['Monte Carlo samples every uncertain parameter, instantiates a deterministic timing graph, runs ordinary STA, and collects arrival/slack/yield distributions. It is conceptually simple and accurate enough to validate analytical methods, but many samples are expensive and difficult to update incrementally.','Analytical path-based SSTA computes distributions for selected paths then takes a statistical maximum. Block-based SSTA propagates distributions through the graph and needs ADD plus statistical MAX/MIN at every merge. Even the maximum of two independent normal variables is not normal, so approximation and correlation tracking are central challenges.'],
['ADD: means add; variance adds with covariance terms.','MAX/MIN: changes distribution shape and criticality probability.','Spatial and structural correlation must be preserved.'],
'μsum=Σμi; σsum²=Σσi²+2Σcovij',
'repeat samples:\n  sample process variables\n  run deterministic STA\n  collect worst slack',
'A path can be statistically critical with meaningful probability even if it is not nominally the longest.'),
S('POCV/SOCV and LVF','Practical statistical OCV models represent each stage by nominal delay plus variation parameters.',
['POCV/SOCV commonly model cell delay as a normal distribution with mean and sigma. Path mean is added normally; path sigma is combined statistically with correlation. Late timing uses μ+Nσ, early uses μ−Nσ, with N often between 3 and 5 according to yield target. Slack sigma combines arrival, required and CRPR terms with their correlations.','A simple coefficient stores σ/μ without slew/load dependence. Liberty Variation Format stores sigma in time units over input transition and output load, improving advanced-node accuracy. Transition variation induces extra downstream delay sigma. At low voltage, threshold-voltage sensitivity can make delay non-Gaussian; moment models add mean shift and skewness beyond mean/variance.'],
['LVF sigma tables follow the same electrical context as nominal timing.','Transition sigma propagates into later delay variation.','Non-Gaussian tails matter at aggressive sigma targets.'],
'latepath=μpath+Nσpath; earlypath=μpath−Nσpath',
'σpath = sqrt(Σσi² + 2Σρijσiσj)',
'“3σ” only has its familiar tail probability when the modeled distribution and correlations are valid.')
],
labTitle:'OCV → AOCV → POCV yield lab',labIntro:'Change depth, stage sigma, correlation and guardband. Compare flat derate, depth-aware derate and statistical path delay with an animated Monte Carlo histogram.',
quiz:[
['For independent equal stage variation, relative path sigma tends to…',['Shrink with √depth','Grow linearly as a percentage','Stay exactly constant'],0,'Absolute sigma grows as √N while mean grows as N, so relative sigma shrinks.'],
['Worst setup OCV uses which capture clock?',['Early','Late','Nominal only'],0,'An early capture edge makes the setup requirement more restrictive.'],
['Why can GBA AOCV be pessimistic at a shared cell?',['It may use shallow-path depth on a deep path','It ignores all derates','It changes the netlist'],0,'Depth is path-specific, but graph merging can retain the worst shallow depth.']
],
refs:[['Global corner','Die-wide PVT/parasitic operating view.'],['OCV','Flat early/late local-variation derates.'],['AOCV','Depth/distance-indexed derates.'],['POCV / LVF','Statistical mean/sigma timing with electrical-condition tables.']]
},
crosstalk:{
number:'09',title:'Crosstalk handling',accent:'Make coupling visible.',color:'#4ddfd2',time:'50-60 min',level:'Injected noise → iterative SI',
deck:'Separate glitch and delay effects, analyze direction and alignment, understand MCF and delay-change curves, filter multi-aggressor pessimism, and propagate coupled waveforms with CCSN.',
objectives:['Predict glitch polarity and positive/negative delay from aggressor behavior','Use timing windows and RSAT to reason about a delay-change curve','Explain multi-aggressor filtering, iteration and CCSN waveform propagation'],
map:['Peak noise','Delay change','Windows','CCSN'],
sections:[
S('Coupling creates current','A switching aggressor injects displacement current through coupling capacitance into a victim.',
['The injected current is approximately Cc·dVaggressor/dt, so larger coupling and faster aggressor slew increase disturbance. If the victim is steady, the result is a glitch: rise/fall bumps within the rails or overshoot/undershoot beyond them. If the victim is switching, coupling changes its waveform and threshold crossing, creating delay uncertainty.','Impact depends on aggressor/victim driver strength, line resistance, coupling location, ground/load capacitance, transition direction and temporal alignment. Aggressor wire resistance can shield the coupling source; victim line resistance and weak victim driver can increase vulnerability.'],
['Aggressor: net causing perturbation.','Victim: net whose voltage/delay changes.','Peak noise and delay change are distinct analyses.'],
'Inoise = Cc · d(Va−Vv)/dt',
'fast aggressor + large Cc + weak victim → larger disturbance',
'Coupling capacitance alone does not determine risk; timing and impedance decide whether charge matters.'),
S('Peak noise: height and width both matter','A steady victim can momentarily enter a hazardous logic region or stress devices.',
['DC noise margin compares glitch height with VIL/VIH rejection. But a narrow pulse may be filtered by receiver inertia even if its peak crosses a DC threshold. AC noise rejection therefore uses a height-versus-width safe region. Load capacitance lowers peak height but can widen the pulse; receiver nonlinearity determines whether it propagates.','Noise on clock can create an extra edge, noise on reset can cause unintended state change, and data noise can be captured. Overshoot/undershoot can stress oxide/junction limits and create reliability risk even if no logic error propagates.'],
['Rise/fall glitch: victim moves within rails.','Overshoot/undershoot: victim exceeds nominal rails.','Receiver propagation: output bump depends on input height, width and load.'],
'charge-sharing upper bound: ΔV ≈ Cc/(Cc+Cvictim) · ΔVa',
'DC check: peak threshold\nAC check: (height,width) rejection region',
'Logical safety and electrical reliability require different limits.'),
S('Crosstalk delay depends on direction','A switching victim sees coupling as a dynamic load rather than a fixed capacitor.',
['Opposite-direction transitions increase voltage difference across Cc and demand more charge from the victim driver, generally slowing the victim: positive delay change. Same-direction transitions keep the coupling voltage more constant and can speed the victim: negative delay change. A quiet aggressor makes Cc behave approximately like ground capacitance.','Miller coupling factor maps Cc to an effective grounded capacitance. Idealized values are 0 for same direction, 1 for quiet and 2 for opposite direction, though real waveform ratios can produce factors roughly from −1 to 3. Fixed MCF is simple but ignores alignment and transition shape.'],
['Same direction: speed-up / min-delay risk.','Opposite direction: slowdown / max-delay risk.','Quiet aggressor: nominal capacitive loading.'],
'Ceff,coupling = MCF · Cc; ideal MCF ∈ {0,1,2}',
'same ↗↗: MCF≈0\nquiet ↗—: MCF≈1\nopposite ↗↘: MCF≈2',
'The “helpful” speed-up can be the hold-critical effect. Positive/negative refers to delay change, not design goodness.'),
S('Alignment creates a delay-change curve','An aggressor matters only when its transition overlaps the victim’s sensitive interval.',
['Relative Signal Arrival Time is aggressor arrival minus victim arrival. Sweeping RSAT produces a Delay Change Curve: far-separated transitions have little effect; near overlap creates a positive or negative lobe whose peak depends on direction, slew, coupling and impedance. Worst alignment is not always identical threshold time because coupling location and waveform shape matter.','STA uses arrival windows, not one deterministic time. If aggressor and victim windows cannot overlap in any relevant cycle, the aggressor can be removed. Unrelated clocks may drift through multiple relative phases, so analysis considers a repeating multi-cycle interval.'],
['RSAT < 0: aggressor earlier than victim.','RSAT > 0: aggressor later.','DCC peak: electrically worst overlap.'],
'RSAT = ATa − ATv; Δdelay = DCC(RSAT, direction, slew, Cc, impedances)',
'window overlap? [Ea,La] ∩ sensitive([Ev,Lv]) ≠ ∅',
'A fixed worst-case MCF can be dramatically pessimistic when timing windows prove transitions cannot align.'),
S('Multiple aggressors need filtering and composition','Blindly aligning every coupled neighbor at its individual worst point creates an impossible super-event.',
['Tools filter aggressors by electrical significance (small induced bump), timing-window overlap and logical correlation. Two nets may be mutually exclusive because of Boolean function or mode. Small aggressors can be statistically composed into a synthetic contributor rather than individually aligned. The strongest contributors receive more exact treatment.','Noise superposition is not perfectly linear because victim driver and receiver cells are nonlinear. Coupled reduced-order networks plus current-source models capture simultaneous interactions better than summing independent scalar delay shifts.'],
['Electrical filter: negligible Cc/current.','Timing filter: no sensitive overlap.','Logical filter: transitions cannot co-occur.','Composition: aggregate many small contributors.'],
'worst physical set ⊂ union of individually possible aggressors',
'candidate → logic filter → timing filter → electrical filter → exact/composed analysis',
'Filtering is accuracy, not merely runtime: it removes combinations that cannot exist.'),
S('Iterative SI and signoff polarity','Timing windows determine coupling, while coupling changes timing windows.',
['The first SI iteration may use broad/infinite windows and combine many aggressors. Updated crosstalk delays change arrivals and shrink/refine windows; subsequent iterations repeat until stable enough. The course notes that PrimeTime commonly uses two iterations by default. CCSN models the aggressor/victim drivers and receiver response with a reduced coupled network and can propagate a noisy waveform through cells.','Worst setup assumes positive delay on launch clock/data and negative delay on capture clock. Worst hold assumes negative delay on launch clock/data and positive delay on capture clock, excluding contradictory treatment on truly common clock portions. Remedies include spacing, shielding, victim strengthening, rerouting, layer changes and aggressor slew control.'],
['Setup: late launch/data + early capture.','Hold: early launch/data + late capture.','Common clock requires consistent event treatment and CRPR-aware analysis.'],
'timing windows → SI delay/noise → updated timing → refined windows → repeat',
'iteration 0: broad windows\niteration 1: update DCC impacts\niteration 2: refined aggressor set',
'Fix selection should target the failure mode: spacing reduces Cc; stronger victim lowers noise but may increase upstream load.')
],
labTitle:'Aggressor alignment & noise lab',labIntro:'Control RSAT, direction, coupling, victim strength and aggressor count. Trace the DCC, glitch pulse and setup/hold polarity while filters remove irrelevant aggressors.',
quiz:[
['Opposite-direction switching usually causes…',['Positive victim delay change','Zero coupling','Only a DC glitch'],0,'It increases voltage change across Cc and charge demanded from the victim driver.'],
['Why does SI timing iterate?',['Crosstalk changes timing windows that determine crosstalk','The netlist changes randomly','Libraries lack delay'],0,'Alignment depends on timing, and timing depends on alignment-induced delay.'],
['Which filter proves two aggressors cannot switch together?',['Logical correlation','Capacitance only','Clock period alone'],0,'Boolean/mode relationships can make simultaneous switching impossible.']
],
refs:[['Peak noise','Maximum glitch on a steady victim.'],['MCF','Coupling-to-ground multiplier; simple but alignment-blind.'],['RSAT / DCC','Relative arrival and victim delay-change curve.'],['CCSN SI','Nonlinear driver/receiver waveform and propagated-noise modeling.']]
}

 function update(){var lines=[],needed={input:['clock','max','min','electrical','audit'],output:['clock','max','min','electrical','audit'],mode:['clock','exception','audit'],cdc:['clock','exception','audit']}[scenario];if(on.clock)lines.push('create_clock -name VREF -period 10');if(on.max)lines.push((scenario==='output'?'set_output_delay':'set_input_delay')+' -clock VREF -max 2.7 [get_ports PORT]');if(on.min)lines.push((scenario==='output'?'set_output_delay':'set_input_delay')+' -clock VREF -min 0.4 [get_ports PORT]');if(on.electrical)lines.push(scenario==='output'?'set_load 0.08 [get_ports PORT]':'set_driving_cell -lib_cell INVX2 [get_ports PORT]');if(on.exception)lines.push(scenario==='mode'?'set_case_analysis 0 [get_ports SCAN_MODE]':'set_false_path -from [get_clocks A] -to [get_clocks B]');if(on.audit)lines.push('check_timing; report_analysis_coverage');setText('#sdcText',lines.join('\n')||'# no constraints selected');var score=needed.filter(function(k){return on[k]}).length/needed.length,missing=needed.filter(function(k){return!on[k]});var o=canvasSetup(),x=o.x,w=o.w,h=o.h;x.clearRect(0,0,w,h);var cx=w/2,cy=h/2;x.strokeStyle='#77766e';x.lineWidth=4;[[65,cy],[cx,65],[w-65,cy],[cx,h-55]].forEach(function(p){line(x,[[cx,cy],p],'#77766e',4);dot(x,p[0],p[1],lesson.color,10)});x.fillStyle=score===1?lesson.color:'#ff684a';x.fillRect(cx-70,cy-35,140,70);x.strokeStyle='#151510';x.strokeRect(cx-70,cy-35,140,70);x.fillStyle='#151510';x.font='bold 13px monospace';x.fillText('DESIGN',cx-27,cy+5);setText('#resultValue',Math.round(score*100)+'% intent coverage');setText('#resultNote',missing.length?'Missing: '+missing.join(', ')+'. A syntactically valid SDC can still be incomplete.':'Temporal, electrical and audit intent are all represented for this scenario.')}
 update();
}
function initChecks(){
 var type='setup';segment('#checkType',function(v){type=v;update()});
 function update(){var e=val('#event'),c=val('#check'),slew=val('#clkSlew');setText('#eventOut',(e<0?'−':'')+fmt(Math.abs(e),2)+' ns');setText('#checkOut',fmt(c,2)+' ns');setText('#clkSlewOut',fmt(slew,2)+' ns');var adjusted=c+.12*(slew-.1),pass;if(type==='setup'||type==='recovery')pass=e<=-adjusted;else if(type==='hold'||type==='removal')pass=e>=adjusted;else if(type==='pulse')pass=Math.abs(e)>=Math.max(0,adjusted);else pass=e<=-adjusted||e>=adjusted;var o=canvasSetup(),x=o.x,w=o.w,h=o.h;x.clearRect(0,0,w,h);var mid=w/2,scale=(w-90)/3;x.strokeStyle='#77766e';x.lineWidth=2;x.beginPath();x.moveTo(40,h/2);x.lineTo(w-35,h/2);x.stroke();x.strokeStyle=lesson.color;x.lineWidth=4;x.beginPath();x.moveTo(mid,35);x.lineTo(mid,h-45);x.stroke();var left=mid-adjusted*scale,right=mid+adjusted*scale;x.fillStyle='rgba(255,104,74,.28)';if(type==='setup'||type==='recovery')x.fillRect(left,70,mid-left,h-140);else if(type==='hold'||type==='removal')x.fillRect(mid,70,right-mid,h-140);else x.fillRect(left,70,right-left,h-140);dot(x,mid+e*scale,h/2,pass?'#d8ff4f':'#ff684a',8);x.fillStyle='#fffdf6';x.font='11px monospace';x.fillText('clock edge 0',mid-38,28);setText('#resultValue',(pass?'PASS':'VIOLATION')+' · '+type);setText('#resultNote','Effective check '+fmt(adjusted,2)+' ns after slew dependence. The colored region is the forbidden event window for '+type+'.')}
 ['#event','#check','#clkSlew'].forEach(function(q){$(q).addEventListener('input',update)});update();
}
function initPaths(){
 var analysis='gba',type='max',selected=0;segment('#pathAnalysis',function(v){analysis=v;update()});segment('#pathType',function(v){type=v;update()});
 function update(){var pen=val('#penalty'),req=val('#req');setText('#penaltyOut',fmt(pen,2)+' ns');setText('#reqOut',fmt(req,1)+' ns');var base=[4.65,4.85,4.55],gba=[pen,.55*pen,.9*pen],pba=[.12*pen,.08*pen,.15*pen],adj=analysis==='gba'?gba:pba,vals=base.map(function(b,i){return b+adj[i]});var critical=type==='max'?vals.indexOf(Math.max.apply(null,vals)):vals.indexOf(Math.min.apply(null,vals));$('#pathList').innerHTML=vals.map(function(v,i){return'<button data-i="'+i+'" class="'+(i===selected?'active':'')+'"><span>P'+(i+1)+(i===critical?' · critical':'')+'</span><b>'+fmt(v,2)+' ns</b></button>'}).join('');$$('#pathList button').forEach(function(b){b.onclick=function(){selected=+b.dataset.i;update()}});var slack=type==='max'?req-vals[selected]:vals[selected]-(req-2.2);var o=canvasSetup(),x=o.x,w=o.w,h=o.h;x.clearRect(0,0,w,h);var ys=[70,155,240];vals.forEach(function(v,i){x.fillStyle=i===critical?lesson.color:'#77766e';x.fillRect(55,ys[i],Math.min(w-105,v/7*(w-105)),22);x.fillStyle='#fffdf6';x.font='11px monospace';x.fillText('P'+(i+1),20,ys[i]+16);x.fillText(fmt(v,2),w-45,ys[i]+16)});setText('#resultValue',(slack>=0?'+':'')+fmt(slack,2)+' ns · P'+(selected+1));setText('#resultNote',(analysis==='gba'?'Merged worst-slew penalty can combine incompatible states.':'Path-specific slew reduces penalty; path ordering may change.')+' '+(type==='max'?'Latest path is critical.':'Earliest path is critical.'))}
 ['#penalty','#req'].forEach(function(q){$(q).addEventListener('input',update)});update();
}
function initVariation(){
 var mode='ocv';segment('#varMode',function(v){mode=v;update()});
 function update(){var n=val('#depth'),rel=val('#sigma')/100,rho=val('#rho'),g=val('#guard'),mu=n*.05,stageSigma=.05*rel,sig=stageSigma*Math.sqrt(n*(1-rho)+n*n*rho),late,desc;if(mode==='ocv'){late=mu*1.10;desc='Flat 10% late derate.'}else if(mode==='aocv'){var der=1+.16/Math.sqrt(n)+.035*rho;late=mu*der;desc='Depth/distance proxy derate '+fmt(der,3)+'.'}else{late=mu+g*sig;desc='μ + '+fmt(g,2)+'σ; path σ='+fmt(sig,3)+' ns.'}setText('#depthOut',n+' stages');setText('#sigmaOut',Math.round(rel*100)+'%');setText('#rhoOut',fmt(rho,2));setText('#guardOut',fmt(g,2)+'σ');var o=canvasSetup(),x=o.x,w=o.w,h=o.h;x.clearRect(0,0,w,h);axes(x,w,h,'path delay →','PDF');var center=w*.48,sx=Math.max(12,sig/(mu*.25)*75),pts=[];for(var px=40;px<w-20;px++){var z=(px-center)/sx,py=h-31-(h-70)*Math.exp(-.5*z*z);pts.push([px,py])}line(x,pts,lesson.color,4);var marker=center+(late-mu)/Math.max(.001,sig)*sx;line(x,[[marker,45],[marker,h-31]],'#ff684a',3);x.fillStyle='#fffdf6';x.font='11px monospace';x.fillText('μ',center-4,h-13);x.fillText('late',Math.min(w-45,marker-12),38);var yieldPct=mode==='pocv'?(1-0.5*Math.exp(-.717*g-.416*g*g))*100:99;setText('#resultValue',fmt(late,3)+' ns late estimate');setText('#resultNote',desc+' Approx one-sided modeled yield '+fmt(yieldPct,3)+'%. Correlation changes √N averaging toward linear accumulation.')}
 ['#depth','#sigma','#rho','#guard'].forEach(function(q){$(q).addEventListener('input',update)});update();
}
function initCrosstalk(){
 var dir='opposite';segment('#xtDir',function(v){dir=v;update()});
 function update(){var r=val('#rsat'),c=val('#couple')/100,s=val('#strength')/100,a=val('#aggr');setText('#rsatOut',(r<0?'−':'')+fmt(Math.abs(r),1)+' ns');setText('#coupleOut',Math.round(c*100)+'%');setText('#strengthOut',Math.round(s*100)+'%');setText('#aggrOut',a);var sign=dir==='opposite'?1:dir==='same'?-1:.35,amp=sign*180*c*(1.1-s*.65)*Math.sqrt(a),impact=amp*Math.exp(-Math.pow(r/.75,2)),mcf=dir==='opposite'?2:dir==='same'?0:1;var o=canvasSetup(),x=o.x,w=o.w,h=o.h;x.clearRect(0,0,w,h);axes(x,w,h,'RSAT →','Δdelay');var pts=[];for(var i=0;i<120;i++){var rr=-2.5+i/119*5,yy=impact===0?0:amp*Math.exp(-Math.pow(rr/.75,2));pts.push([38+i/119*(w-58),h/2-yy*.55])}line(x,pts,impact>=0?'#ff684a':lesson.color,4);var px=38+(r+2.5)/5*(w-58),py=h/2-impact*.55;dot(x,px,py,'#d8ff4f',7);line(x,[[38,h/2],[w-20,h/2]],'#77766e',1);setText('#resultValue',(impact>=0?'+':'')+fmt(impact,1)+' ps victim delay');setText('#resultNote','Ideal MCF≈'+mcf+'. '+(Math.abs(r)>1.4?'Weak overlap: timing filtering nearly removes this aggressor.':'Windows overlap the sensitive region.')+' Estimated steady-victim glitch scales to '+fmt(Math.abs(impact)*2.1,0)+' mV.')}
 ['#rsat','#couple','#strength','#aggr'].forEach(function(q){$(q).addEventListener('input',update)});update();
}
