h:120px;height:90px;border:3px solid var(--topic);border-radius:50%;opacity:.3;transform:rotate(14deg);pointer-events:none}.circuit-board canvas{display:block;width:100%;height:292px}.delay-readout{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:11px 0}.delay-readout article{min-height:112px;padding:14px 12px;background:#20211e;border:1px solid #5d5c56;border-radius:13px 8px 15px 10px;display:flex;flex-direction:column;justify-content:center}.delay-readout article:before{content:"";display:block;width:27px;height:4px;margin-bottom:10px;background:var(--delay-color);border-radius:6px}.delay-readout span{color:#b6b4ac;font:750 .57rem/1.3 var(--mono);text-transform:uppercase}.delay-readout strong{margin:5px 0;color:var(--delay-color);font:900 clamp(.91rem,1.7vw,1.18rem)/1 var(--sans)}.delay-readout small{color:#efede5;font:650 .56rem/1.35 var(--mono)}.delay-readout .dist{--delay-color:#7183ff}.delay-readout .lump{--delay-color:#ff7b61}.delay-readout .segment{--delay-color:#d8ff4f}.delay-readout .elmore{--delay-color:#c7c5bc}.response-canvas{min-height:466px}.interconnect-lab .lab-result{margin-top:11px}.interconnect-lab #labChallenge{background:var(--lime);color:var(--ink);border-color:var(--ink);box-shadow:4px 5px 0 var(--ink)}.interconnect-lab #labChallenge:hover{box-shadow:6px 9px 0 var(--ink)}.reserved-lab{min-height:410px;padding:58px clamp(24px,7vw,78px);position:relative;overflow:hidden;background:linear-gradient(135deg,#20211e,#171815);border:1px solid #65645e;border-radius:18px 11px 20px 13px;display:flex;flex-direction:column;justify-content:center}.reserved-lab h3{max-width:660px;margin:13px 0 12px;color:#fffdf6;font-size:clamp(1.55rem,4vw,3rem)}.reserved-lab p{max-width:680px;margin:0;color:#c4c2ba;line-height:1.75}.reserved-sketch{position:absolute;right:6%;top:50%;width:210px;height:210px;opacity:.32;transform:translateY(-50%)}.tree-sketch:before,.tree-sketch:after,.tree-sketch i{content:"";position:absolute;background:var(--topic)}.tree-sketch:before{left:12px;top:102px;width:150px;height:5px;transform:rotate(-18deg)}.tree-sketch:after{left:82px;top:73px;width:110px;height:5px;transform:rotate(42deg)}.tree-sketch i{width:24px;height:24px;border:4px solid #fffdf6;border-radius:50%}.tree-sketch i:nth-child(1){left:0;top:90px}.tree-sketch i:nth-child(2){left:75px;top:56px}.tree-sketch i:nth-child(3){right:7px;top:15px}.tree-sketch i:nth-child(4){right:0;bottom:32px}.tree-sketch i:nth-child(5){left:72px;bottom:9px}.ceff-sketch{border:5px solid var(--topic);border-radius:50% 44% 53% 47%;transform:translateY(-50%) rotate(8deg)}.ceff-sketch:before{content:"Ceff";position:absolute;inset:0;display:grid;place-items:center;color:#fffdf6;font:900 2rem/1 var(--mono)}.ceff-sketch i{position:absolute;width:45px;height:5px;background:#fffdf6}.ceff-sketch i:nth-child(1){left:-47px;top:70px}.ceff-sketch i:nth-child(2){right:-47px;top:70px}.ceff-sketch i:nth-child(3){right:25px;bottom:-25px;transform:rotate(65deg)}

</style><title>Timing checks — STA Quest</title></head><body><script>window.STA_LESSON_ID='checks'</script><script>
(function(){
'use strict';
var S=function(title,lead,paras,bullets,formula,code,callout){return{title:title,lead:lead,paras:paras,bullets:bullets,formula:formula,code:code,callout:callout}};
var LESSONS={
flow:{
number:'01',title:'Timing flow & basic concepts',accent:'See the engine, not just the report.',color:'#d8ff4f',time:'35-45 min',level:'Foundation → engine view',
deck:'Build the complete mental model: why STA exists, how a circuit becomes a timing graph, what the engine propagates, and where accuracy is deliberately traded for capacity.',
objectives:['Distinguish exhaustive static analysis from vector-based simulation','Identify every required STA input and the failure caused by a missing one','Trace netlist → graph → propagation → path reporting → signoff'],
map:['Design views','Timing graph','Propagation','Signoff'],
sections:[
S('Why timing needs an abstraction','Timing signoff is a coverage problem under enormous design complexity, not merely a delay calculation.',
['Dynamic simulation solves circuit behavior for chosen stimuli and produces voltage/current waveforms. Its accuracy is excellent, but the result only covers the applied vectors. STA instead asks whether every topologically legal synchronous timing relationship satisfies its constraints. It replaces vectors with a declared environment and replaces full transistor networks with characterized timing models.','That trade gives STA high capacity and broad coverage, but it imposes boundaries: ordinary cell-level STA assumes synchronous structure, cannot directly resolve combinational loops, and intentionally combines worst cases. It verifies temporal legality, not functional equivalence. A logically wrong mux select can still be perfectly timed.'],
['Dynamic simulation: precise waveform, limited vector coverage, slow at scale.','STA: constraint-driven, exhaustive over legal graph paths, fast, worst-case.','Device-level STA keeps the graph/constraint framework but simulates recognized transistor blocks when no cell model exists.'],
'capacity ↑ as abstraction ↑; accuracy ↑ as physical detail ↑',
'Circuit/device equations → SPICE → cell + interconnect models → timing graph',
'First principle: a timing report is only as correct as the models and constraints that created it.'),
S('The four essential design views','STA fuses logical connectivity, characterized behavior, physical parasitics, and timing intent.',
['The gate-level netlist supplies instances, pins, ports and connectivity. Liberty supplies logic functions, pin capacitance, delay arcs, timing senses, sequential constraints and waveform models. Extracted parasitics supply resistance, ground capacitance and coupling capacitance. SDC supplies clocks, I/O relationships, electrical environment, design rules, modes and exceptions.','Operating conditions select process, voltage and temperature views. Modern multi-corner multi-mode analysis binds compatible libraries, parasitics and constraints into scenarios. A mismatch can be subtle: a fast library with slow-corner parasitics may create a scenario that no silicon ever experiences, while an unbound corner can leave real risk unchecked.'],
['Netlist answers “what connects?”','Liberty answers “how does each cell respond and what must it obey?”','Parasitics answer “how does the routed network load and delay the signal?”','SDC answers “which behavior is required in this mode?”'],
'STA scenario = netlist + libraries + parasitics + SDC + operating condition',
'read_verilog design.v\nlink_design TOP\nread_parasitics top.spef\nread_sdc functional.sdc',
'Coverage is not the same as correctness: STA can exhaustively analyze the wrong design environment.'),
S('From circuit to timing graph','The timing graph is the algorithmic bridge between a physical circuit and scalable propagation.',
['Ports and pins become graph nodes. A combinational input-to-output relation becomes a cell delay arc. A driver-to-load connection becomes an interconnect arc. Setup, hold, recovery, removal and gating relations become check arcs. Sequential elements break data propagation: a flip-flop has clock-to-Q launch arcs and D-to-clock checks, but no ordinary D-to-Q combinational delay arc.','A legal combinational timing graph is acyclic, so nodes can be processed in topological order. Latches are more subtle because transparency can create graph loops and time borrowing; dedicated loop-breaking and latch analysis are required. Clock propagation is performed before data propagation because launch/capture events define the temporal frame for every check.'],
['Cell arc: characterized behavior inside a library cell.','Net arc: routed driver-to-receiver delay and slew degradation.','Check arc: a required relationship rather than propagated data delay.'],
'node timing state = {rise/fall} × {early/late} × {scenario} × {clock/path context}',
'FF/CLK → FF/Q  [clock-to-Q arc]\nFF/D   → FF/CLK [setup/hold check]\nFF/D   ⇏ FF/Q   [no combinational arc]',
'Whenever a path “disappears,” ask whether a graph arc was disabled, a condition evaluated false, or an exception removed the check.'),
S('Stages, waveforms and propagation state','A stage couples the driver model, interconnect response and receiver loading; its output becomes the next stage input.',
['The propagation engine does not usually carry an arbitrary analog waveform. NLDM carries arrival time and transition time; current-source models may retain multiple voltage/time points. Rise and fall are propagated separately because timing sense and pull-up/pull-down behavior differ. Early and late values are propagated separately because setup and hold seek opposite extremes.','Delay and slew are coupled. The input slew selects a cell-table value, the cell model drives the RC network, the network produces receiver arrival/slew, and that slew selects the next arc delay. This is why choosing only the path with the latest arrival at a reconvergent pin can be pessimistic or even miss the state with the most damaging slew unless the engine retains enough state.'],
['Driver: cell output current or equivalent source.','Interconnect: RC/RLC response and coupling.','Receiver: static or dynamic pin capacitance plus its next timing arc.'],
'ATout = ATin + dcell(slewin,load) + dnet(driver,RC,receiver)',
'for node in topological_order:\n  propagate rise/fall, early/late\n  merge candidates conservatively',
'A “delay number” is never isolated; it is conditional on slew, load, transition, corner, voltage and path context.'),
S('The end-to-end STA flow','Signoff is a sequence of model construction, broad screening, focused refinement and coverage audit.',
['A practical run reads and links the design, creates scenarios, applies constraints, annotates parasitics, propagates clocks, calculates cell/net delays, performs graph-based timing, enumerates violating paths, removes common-clock pessimism and uses path-based analysis for final confirmation. Signal integrity and variation may require iterative or statistical refinement.','Closure is not merely WNS ≥ 0. Engineers also inspect total negative slack, violating endpoint count, unconstrained endpoints, exception coverage, transition/capacitance/fanout limits, pulse width, clock gating, recovery/removal and noise. A clean summary with unconstrained paths is not signoff.'],
['GBA screens the whole graph quickly.','CRPR removes contradictory variation on truly common clock circuitry.','PBA repropagates selected paths with path-specific slew/variation/SI state.','Coverage checks validate clocks, endpoints, disabled arcs and exceptions.'],
'inputs → clocks → delay/slew → AT/RAT → slack → N-worst → CRPR/PBA/SI → coverage',
'check_timing\nreport_analysis_coverage\nreport_global_timing\nreport_timing -delay_type max',
'Signoff question: “Did all intended checks run with valid models?” comes before “Is the worst slack positive?”'),
S('Worked example: one register path','Reduce a report to launch event, data flight, capture requirement and margin.',
['Assume the launch edge is at 0 ns, launch clock latency is 0.80 ns, clock-to-Q is 0.12 ns, data cells/nets total 2.56 ns, capture edge is at 4 ns, capture latency is 0.70 ns, setup is 0.16 ns and uncertainty is 0.10 ns. Data arrives at 3.48 ns. The setup required time is 4.44 ns. Slack is +0.96 ns.','For hold, the same nominal edge is used. Early launch clock/data and late capture clock are selected, hold time is added to the requirement, and uncertainty increases the requirement. The arithmetic looks similar, but the selected extrema and slack sign convention differ.'],
['Arrival = launch edge + launch latency + C2Q + data path.','Setup required = capture edge + capture latency − setup − uncertainty.','Setup slack = required − arrival.'],
'AT = 0 + 0.80 + 0.12 + 2.56 = 3.48 ns; RAT = 4 + 0.70 − 0.16 − 0.10 = 4.44 ns',
'data required time   4.44\ndata arrival time   -3.48\nslack (MET)          0.96',
'The path total is meaningful only after you verify which edge, clock path, derates and uncertainty produced it.')
],
labTitle:'Timing graph propagation lab',labIntro:'Seed three input arrival times and three output requirements. The engine propagates AT forward and RAT backward across a reconvergent graph, computes every node slack, and exposes the critical path.',
quiz:[
['A run reports no violations, but 15% of endpoints are unconstrained. What is the correct conclusion?',['The design is clean','The result is incomplete','Those endpoints are automatically false'],1,'Unconstrained endpoints did not receive the intended temporal requirement, so positive timing results cannot establish coverage.'],
['Why is clock propagation performed before data timing?',['Clock edges define launch and capture requirements','It makes cells smaller','It removes all RC delay'],0,'Data checks are framed by clock events, their latency and their uncertainty.'],
['Which relationship is a check arc rather than a delay arc?',['INV/A → INV/Y','FF/D → FF/CLK','Driver pin → receiver pin'],1,'D-to-clock expresses setup/hold legality; it does not propagate data through the cell.']
],
refs:[['Timing graph','Ports/pins are nodes; cell, net and check relationships are directed arcs.'],['AT / RAT','Arrival propagates forward; required time propagates backward.'],['WNS / TNS','Worst negative slack and sum of negative endpoint slacks.'],['Coverage audit','Checks clocks, unconstrained endpoints, disabled arcs, exceptions and violated checks.']]
},
interconnect:{
number:'02',title:'Interconnect modeling',accent:'Turn geometry into time.',color:'#4ddfd2',time:'45-55 min',level:'RC physics → reduced models',
deck:'Follow a routed wire from distributed electromagnetic structure to RC tree, moments, Elmore delay, pole/residue reduction and pre-/post-layout models.',
objectives:['Explain when lumped, distributed RC and RLC models are appropriate','Compute Elmore delay on a branched RC tree and name its failure modes','Connect moments and model reduction to signoff waveform calculation'],
map:['Geometry','RC tree','Moments','Reduction'],
sections:[
S('Geometry becomes a distributed network','Resistance and capacitance are spread continuously along a wire; the model must preserve the effect relevant to timing.',
['Wire width, thickness, spacing, distance to adjacent layers and dielectric constants determine resistance and capacitance per unit length. Pitch is width plus spacing; aspect ratio influences lateral coupling. A physical segment is distributed RLC, but dense on-chip signal wires usually lie in the RC regime because their resistance is high and edge rates are not fast enough for inductive behavior to dominate.','Inductance matters more for low-resistance global wires, clock/power structures, packages and boards. Treating every local signal as RLC wastes capacity; treating a long, low-resistance global line as RC can miss ringing or altered flight time. Model selection is an accuracy/capacity decision.'],
['R grows with length and resistivity, and falls with cross-sectional area.','Ground and coupling capacitance grow with geometry and proximity.','RLC significance rises when resistance is low and signal bandwidth is high.'],
'R = ρL/(wt); distributed parameters r, l, c are specified per unit length',
'physical geometry → extraction → R/C network → reduction → timing engine',
'The extracted network is not “the delay.” It is a linear load that must be solved together with a nonlinear driver and receiver.'),
S('Lumped versus distributed RC','Where capacitance sits relative to resistance changes both delay and waveform shape.',
['A single lumped capacitance assumes the entire wire is instantly equipotential. Driven through R, its 50% step delay is about 0.69RC. A uniform distributed RC line charges near capacitance earlier and remote capacitance later; its far-end 50% delay is about 0.38RC. Thus equal total R and C do not imply equal delay.','T and π sections discretize the line. The course notes that roughly three to four sections often capture both delay and transition well for a uniform line. A branched net becomes an RC tree: one source, resistive branches and capacitors to ground. Coupling adds cross-links between nets and breaks the simple independent-tree view.'],
['Lumped C: acceptable when wire resistance is negligible versus driver resistance.','Distributed RC: needed when wire resistance is material.','More segments improve fidelity but enlarge the solve.'],
't50,lumped ≈ 0.69RC; t50,uniform distributed ≈ 0.38RC',
'π section: C/2 — R — C/2\nN sections: repeat with R/N and C/N',
'The 0.38RC relation is for a uniform line and idealized excitation; real trees, ramps and receivers need a full stage model.'),
S('Elmore delay: the first moment','Elmore replaces the hard median of the impulse response with its centroid.',
['For an RC tree, the delay to receiver i is the sum over resistances on its source-to-i path, each weighted by all capacitance downstream of that resistance. Capacitance on a side branch can slow a shared upstream segment even if the branch is not on the direct receiver path. Two tree passes can compute all receiver Elmore delays efficiently.','The result is the first moment of the transfer function. It is fast, monotonic and intuitive, so it is valuable for synthesis and physical optimization. But it is an upper bound under common ramp assumptions, is less accurate near the driver and does not correctly model resistive shielding: as a far branch resistance tends to infinity, its capacitance should become invisible, while basic Elmore may continue to charge it through upstream weighting.'],
['Downstream capacitance includes every capacitor separated from the source by that resistor.','Shared upstream resistance couples the delay cost of multiple branches.','Elmore is an estimate/optimization metric, not modern signoff.'],
'tE(i) = Σ[k on source→i path] Rk · Cdownstream(k)',
'R1 feeds C1,C2,C3; R2 feeds C2,C3\ntE(node2)=R1(C1+C2+C3)+R2(C2+C3)',
'Sanity check any RC metric against shielding: if a branch becomes electrically unreachable, its load contribution should vanish.'),
S('Moments and waveform intuition','One number locates a response; multiple moments describe its shape.',
['The derivative of a monotone step response behaves like a probability density. Its mean corresponds to response location (delay), while its second central moment describes spread (transition width). Higher moments capture asymmetry and tail behavior. Circuit moments can be derived directly without computing a dense time-domain waveform.','Asymptotic Waveform Evaluation matches moments of the original network to a compact pole/residue representation. The reduced model can reproduce more of the waveform than Elmore while avoiding the original network dimension. Naive high-order fits can be unstable or non-passive, so robust reduction algorithms preserve physical behavior.'],
['First moment: delay-like location.','Second central moment: width/slew intuition.','Higher moments: tail and waveform shape.','Pole/residue model: compact system used for fast evaluation.'],
'H(s)=m0+m1s+m2s²+… = Σj kj/(s−pj)',
'original moments m0…mq ≈ reduced-model moments m0…mq',
'Model order should follow the observable: a delay-only optimizer needs less information than a noise-aware waveform propagator.'),
S('Before placement and after extraction','Interconnect knowledge evolves throughout implementation.',
['Before physical routing, wire-load models estimate length, resistance and capacitance from fanout and/or block area. Best-case trees place receivers near the driver, balanced trees split wire equally, and worst-case trees place loads at the far end. These are planning abstractions, not a substitute for extracted parasitics.','After placement and routing, SPEF-like parasitics provide topology, node capacitances, segment resistances and coupling. Reduction keeps receiver transfer behavior and driving-point admittance needed by the cell model. Coupling capacitance must remain available for crosstalk; blindly grounding it with a fixed factor discards alignment dependence.'],
['Pre-layout: zero/wire-load/statistical estimate.','Post-layout: extracted RC plus coupling and reduction.','Signoff: driver + reduced network + receiver solved per scenario.'],
'wire_load: fanout → estimated length → R,C; extraction: geometry → explicit network',
'wire_load("8000") {\n  capacitance: 0.024051; resistance: 1.86e-3;\n  fanout_length("2", "18.49");\n}',
'Do not compare pre-route and post-route delay without separating topology change, extraction corner and driver-slew change.'),
S('Receiver-specific delay in a tree','A multi-sink net does not have one universal wire delay.',
['Each receiver sees a different transfer function because it has a different path resistance, downstream capacitance and branch loading. A near receiver may have small delay but still be affected by capacitance on a shared trunk. A far receiver sees more series resistance and often slower slew, which then increases the next cell delay.','Optimization therefore balances driver size, buffering, branching and placement. A stronger driver reduces source resistance but adds input capacitance to the previous stage and may increase coupling aggressiveness. Buffer insertion breaks a long quadratic RC dependence into shorter sections, but costs power, area and new variation.'],
['Net delay and receiver slew must be computed per sink.','A buffer changes both upstream loading and downstream drive.','Criticality depends on the full stage chain, not longest geometric wire alone.'],
'stage delay = driver response + receiver-specific interconnect response',
'sink A: shared trunk + short branch\nsink B: shared trunk + long branch\ncompute separate t50 and slew',
'The best interconnect fix is rarely “minimum wire delay” in isolation; it is the change that improves end-to-end slack without creating new violations.')
],

['What does the second central moment suggest intuitively?',['Waveform width / transition','Logic function','Clock name'],0,'Under the PDF analogy, the second central moment represents response spread.']

cell:{
number:'03',title:'Cell modeling',accent:'Interrogate the library.',color:'#ffdb45',time:'50-60 min',level:'Liberty → current sources',
deck:'Read the timing meaning inside Liberty, interpolate NLDM correctly, understand Ceff/Miller limitations, and see why waveform-aware CCS/CCSN models improve advanced-node timing and noise.',
objectives:['Decode timing_type, timing_sense, thresholds and lookup templates','Perform bilinear NLDM interpolation and explain its abstraction errors','Contrast NLDM, CCST/ECSM, true current-source and CCSN data'],
map:['Liberty arcs','NLDM','Ceff + Miller','CCSN'],
sections:[
S('A cell is a set of conditional arcs','The timing model is organized around pin-to-pin behavior, not a single delay number per instance.',
['A Liberty cell contains pins, logic function, direction, capacitance, constraints and timing groups. Each timing group is normally stored under the destination pin and names a related source pin. timing_type says whether the group is combinational, clock-to-Q, setup, hold, recovery, removal, pulse width or another relation. when conditions can enable only specific arcs.','timing_sense describes transition polarity. Positive-unate means input rise can only produce output rise and input fall output fall. Negative-unate reverses polarity. Non-unate means the output direction depends on other inputs or state; both transition possibilities may need propagation.'],
['Combinational and clock-to-Q groups carry delay/slew data.','Constraint groups carry setup/hold-like values.','Conditional arcs must agree with case analysis and logic state.'],
'arc identity = related_pin + destination_pin + timing_type + timing_sense + condition',
'pin(Y) { timing() {\n related_pin:"A"; timing_type:combinational;\n timing_sense:negative_unate;\n} }',
'If a report uses the “wrong” rise/fall table, inspect timing sense and the actual transition at the related pin.'),
S('Waveform thresholds define measured delay','Delay and transition values only make sense with their voltage-threshold conventions.',
['Propagation delay is commonly measured between 50% crossings of input and output. Transition time is measured between lower and upper thresholds, often 20–80% or 30–70%, with separate rise/fall definitions. STA must translate slews consistently when libraries use different thresholds.','Representing a real waveform with arrival plus one transition number is equivalent to fitting a saturated ramp. Two waveforms can share the same 20–80% slew and 50% arrival yet differ around the receiver threshold or contain noise. Those discarded details explain part of NLDM error.'],
['input_threshold_pct_* locates input delay crossing.','output_threshold_pct_* locates output delay crossing.','slew_lower/upper_threshold_pct_* define transition measurement.'],
'delay = tout@threshold − tin@threshold; slew = tupper − tlower',
'input_threshold_pct_rise : 50;\nslew_lower_threshold_pct_rise : 30;\nslew_upper_threshold_pct_rise : 70;',
'Never compare two reported slew numbers before checking threshold definitions.'),
S('NLDM lookup and interpolation','NLDM stores characterized delay and output transition on an input-slew/output-load grid.',
['For every relevant arc and transition, SPICE characterization sweeps input transition and total output capacitance. cell_rise/cell_fall store propagation delay; rise_transition/fall_transition store output slew. At runtime, the engine brackets the requested slew and load and performs bilinear interpolation. Extrapolation beyond the table is riskier and often accompanies max-transition/capacitance violations.','The model is efficient and library-compatible, but reduces the input to a ramp and the load to one static capacitance. It cannot naturally represent a distorted input waveform, a strongly resistive distributed load or dynamically changing receiver capacitance.'],
['Index 1 commonly: input_net_transition.','Index 2 commonly: total_output_net_capacitance.','Four neighboring table points determine a bilinear interpolated value.'],
'f(x,y)=(1−a)(1−b)f00+a(1−b)f10+(1−a)bf01+abf11',
'cell_rise(template) {\n index_1("0.02,0.08"); index_2("0.01,0.10");\n values("0.05,0.11", "0.09,0.18");\n}',
'A design-rule violation is also a model-validity warning: the engine may be extrapolating outside characterized space.'),
S('Ceff closes the driver–wire loop','A resistive network cannot be faithfully replaced by its total capacitance.',
['With wire resistance comparable to driver resistance, remote capacitance is shielded during the important early part of the transition. Using total capacitance overstates the load. Effective capacitance maps the RC network to the single value expected by NLDM such that the simplified load draws similar average current up to the delay threshold.','A common flow reduces the RC tree to a π model, reconstructs a Thevenin-like driver from tables, guesses Ceff, computes current/response, and iterates until the effective load and driver waveform agree. Because driver strength itself depends on output voltage and selected table values, this is a nonlinear fixed-point interaction.'],
['Ceff is generally between near capacitance and total capacitance.','The target often matches charge/current through the 50% point.','Driver model and Ceff are solved iteratively.'],
'∫0→t50 Isource,π(t)dt ≈ ∫0→t50 Isource,Ceff(t)dt',
'guess Ceff → lookup delay/slew → build driver → solve π → update Ceff → repeat',
'Ceff is not a physical capacitor in the layout; it is an equivalence chosen for a measurement objective.'),
S('Dynamic receiver capacitance and Miller effect','A receiver input is not a constant capacitor because its internal output moves during the input transition.',
['Gate-to-drain capacitance couples the receiver input and output. In an inverting stage, output movement can multiply the apparent input capacitance. The effect depends on relative input/output motion: a fast input completed before the output moves sees little Miller loading; a slow input overlapping a fast output can see much more.','CCST/ECSM improve this with sampled output waveforms and two- or multi-segment receiver capacitance. A first capacitance models loading up to the delay threshold; a second models the tail and slew. These “half CCS” models retain input-slew and output-load indices, so they are more waveform-aware but not fully arbitrary current-source models.'],
['Static pin capacitance misses state-dependent input current.','Dynamic C segments approximate charge over voltage regions.','Miller loading couples adjacent stages and waveform shapes.'],
'Cin,eff ≈ Cgs + Cgd(1−Av)',
'fast input / slow output → small overlap\nslow input / fast output → strong Miller overlap',
'Receiver modeling matters upstream: the next cell’s internal motion changes the present cell’s load.'),
S('True current-source and CCSN models','Current as a function of terminal voltages can interact directly with an arbitrary RC network.',
['A true current-source driver stores iout=f(vin,vout), optionally with internal capacitance for calibration. It makes no saturated-ramp assumption for input and does not require the output network to collapse to Ceff. A waveform engine integrates the nonlinear source with the reduced interconnect.','CCSN characterizes channel-connected blocks. It can include DC current versus input/output voltage, output-voltage waveforms, propagated-noise tables and Miller capacitance. For multi-stage cells, boundary and internal CCB models allow a noisy input to be propagated instead of reduced prematurely to a clean ramp. This is why CCSN is central to accurate signal-integrity analysis.'],
['DC current tables: electrical response versus vin/vout.','Output-voltage vectors: waveform calibration across slew/load.','Noise propagation tables: output response to bump height/width.','Miller tables: dynamic internal coupling.'],
'NLDM: number → number; CCSN: waveform + nonlinear source → waveform',
'dc_current(template) { variable_1:input_voltage; variable_2:output_voltage; }',
'Model evolution follows technology: faster cells and more resistive/coupled wires require more waveform information.')
],
labTitle:'NLDM interpolation & model lens',labIntro:'Move inside and beyond a characterization grid. See bilinear weights, delay/slew, extrapolation risk and how richer models retain waveform detail.',
quiz:[
['A requested load lies outside the largest NLDM index. What is the main concern?',['Extrapolation outside characterized validity','The logic function changes','The clock becomes virtual'],0,'The result relies on extrapolation and often coincides with a max-capacitance violation.'],
['Why is Ceff often smaller than total wire capacitance?',['Wire resistance shields remote capacitance during the transition','Capacitance is deleted','Miller effect is always zero'],0,'Remote capacitance does not draw full current before the delay threshold.'],
['Which data most directly enables propagated-noise modeling?',['CCSN noise tables','Cell area','Fanout count alone'],0,'CCSN records the cell/CCB response to input noise bump shapes.']
],
refs:[['timing_sense','positive_unate, negative_unate or non_unate transition mapping.'],['NLDM','2-D slew/load delay and transition lookup.'],['Ceff','Equivalent load chosen to match driver-network interaction.'],['CCSN','Voltage-dependent current, waveform, noise and Miller data.']]
},
clocks:{
number:'04',title:'Clock definition',accent:'Edges are the coordinate system.',color:'#5268ff',time:'35-45 min',level:'SDC edges → propagated clocks',
deck:'Define primary, generated and virtual clocks; map edge relationships; separate source/network latency; and understand how skew, jitter, duty distortion and uncertainty enter checks.',
objectives:['Create waveforms and generated-clock edge relationships without losing phase','Separate source latency, ideal network latency and propagated insertion delay','Predict how uncertainty changes setup and hold requirements'],
map:['Primary','Generated','Latency','Uncertainty'],
sections:[
S('A clock is a named sequence of events','STA needs explicit edge times and transition polarity, not merely a frequency.',
['create_clock attaches a primary clock to a design port or pin and defines period plus waveform. A two-value waveform describes one rise and one fall; longer lists can express multiple edges. The waveform determines duty cycle and which rise/fall events may launch or capture.','Creating unrelated clocks at two physically related nodes discards phase correlation. If downstream clock behavior is derived by logic, define it as a generated clock so the engine preserves its relation to the master and can trace latency through the source path.'],
['Period defines repetition.','Waveform defines edge offsets and polarity.','Clock name is used by constraints, groups and reports.'],
'create_clock -name CLK -period T -waveform {rise fall} source',
'create_clock -name CLK -period 10 -waveform {0 4} [get_ports CLK]',
'A clock object is timing intent; the voltage net is physical connectivity. The two must be correctly attached.'),
S('Generated clocks encode causality','Division, multiplication, inversion, gating and edge mapping must remain related to a master.',
['create_generated_clock names a source pin/port on the master path and a target where the derived clock exists. -divide_by and -multiply_by set frequency ratios; -invert flips phase; -combinational describes logic relation; -edges maps derived edges to numbered master edges for irregular patterns.','A generated clock’s total latency can include master source latency, derived source latency and derived network latency. If the master is propagated, the engine can calculate travel to the generated source unless an explicit override replaces it. Clock muxes may carry multiple generated clocks; mode constraints must select legal behavior.'],
['Divider: period grows by divide factor.','Multiplier: period shrinks by multiply factor.','Edge mapping: exact phase/duty relationship.','Gated clock: same event sequence when enabled, but requires gating checks.'],
'tgenerated(edge k) = f(tmaster edges) + source/network propagation',
'create_generated_clock -name CLK_DIV2 -source [get_ports CLK] \\\n -divide_by 2 [get_pins UDIV/Q]',
'Generated clocks should be defined at the point where the derived waveform is physically created, not wherever it is convenient to name it.'),
S('Virtual clocks model the world outside','An I/O interface often needs a reference that is not a physical on-chip net.',
['A virtual clock has period and waveform but no source object. It cannot propagate. It represents the external launch or capture clock used by input/output delay constraints, allowing board/package latency and external phase to be modeled independently of internal clock-tree delay.','Using the internal clock directly for I/O can accidentally share latency or uncertainty that is not common across the chip boundary. A virtual clock creates a clean contract: input delay includes external clock-to-Q plus board delay; output delay includes external board delay plus receiver setup/hold.'],
['No associated port/pin.','Valid reference for set_input_delay and set_output_delay.','Cannot acquire propagated network latency.'],
'virtual reference + I/O delay = external timing contract',
'create_clock -name VIO -period 8 -waveform {0 4}\nset_input_delay -clock VIO -max 2.7 [get_ports DIN]',
'The SDC value is not “time inside the chip.” It represents the portion of the external system assigned to the interface.'),
S('Latency: before and inside the design','Source and network latency have different physical meanings and lifecycle.',
['Source latency is delay from the original clock source to the design clock definition point. Network latency is delay from that point through the on-chip clock tree. Before CTS, network latency may be ideal and specified. After CTS, propagated clocks use actual cell/net delay.','Insertion delay is not automatically skew. Two sinks can each have 1 ns latency and zero skew, or 0.5 ns and 1.5 ns latency with 1 ns skew. For setup and hold, launch and capture latencies enter with opposite signs; useful skew can help one check while hurting another.'],
['set_clock_latency -source models pre-boundary delay.','set_clock_latency without -source can model ideal network latency.','set_propagated_clock switches to calculated clock-tree delay.'],
'skew = capture latency − launch latency (for equivalent edges)',
'set_clock_latency -source 0.8 [get_clocks CLK]\nset_propagated_clock [get_clocks CLK]',
'Always read a timing report’s “ideal” versus “propagated” clock annotation before interpreting latency.'),
S('Non-ideal edge motion','Skew, jitter and duty-cycle distortion describe different uncertainty structures.',
['Skew is spatial variation between equivalent edges at different sinks. Jitter is temporal movement of same-polarity consecutive edges. Duty-cycle distortion moves opposite-polarity edges relative to one another, affecting half-cycle paths and pulse width. Variation and crosstalk can create additional path-specific clock uncertainty.','set_clock_uncertainty adds pessimism. For setup it moves the required time earlier; for hold it moves the required time later. Separate -setup/-hold and inter-clock specifications avoid applying one blanket number where relationships differ. Rise/fall-specific options can model duty-cycle effects.'],
['Setup uncertainty consumes cycle budget.','Hold uncertainty enlarges the protected post-edge interval.','Uncertainty should not double-count variation already modeled explicitly.'],
'RATsetup = capture edge + latency − setup − uncertainty',
'set_clock_uncertainty -setup 0.12 [get_clocks CLK]\nset_clock_uncertainty -hold 0.05 [get_clocks CLK]',
'Margin is necessary, but unexplained margin can hide double counting and waste performance.'),
S('Clock propagation coverage','Correct clock reachability is a prerequisite for every sequential path check.',
['Clock propagation starts at primary/generated definitions and follows clock-compatible arcs through buffers, inverters, muxes, dividers and gating cells. A sequential cell consumes a clock but its data output is not part of the clock tree. A PLL or clock generator may require abstract/generated definitions rather than ordinary cell propagation.','Missing generated clocks, disabled mux arcs or incorrect case analysis can leave endpoints unclocked or associated with the wrong clock. Reports should confirm clock roots, sinks, latency and generated relationships. Multi-clock pins require explicit intent rather than relying on accidental propagation order.'],
['Report clocks and their sources/waveforms.','Check that every sequential endpoint has the intended clock.','Audit mux/gate mode conditions and generated-clock masters.'],
'clock coverage = intended sinks reached by correct named edge sequence',
'report_clocks\nreport_clock_timing -type latency\ncheck_timing -include clock_crossing',
'Clock bugs often masquerade as data-path bugs because the data required time was built from the wrong edge.')
],
labTitle:'Clock edge-mapping studio',labIntro:'Shape a master clock, derive a divided or multiplied clock, add latency and uncertainty, and inspect the exact setup edge budget plus generated-clock SDC.',
quiz:[
['Why prefer create_generated_clock over an unrelated create_clock at a divider output?',['It preserves master phase/edge causality','It removes all delay','It disables setup checks'],0,'Generated clocks retain their temporal and propagation relationship to the master.'],
['A setup uncertainty of 0.10 ns does what?',['Moves required time 0.10 ns earlier','Moves arrival 0.10 ns earlier','Adds 0.10 ns of logic delay'],0,'Uncertainty consumes available setup budget.'],
['Can a virtual clock be propagated through a clock tree?',['Yes','No','Only at hold'],1,'It has no physical source and serves only as a timing reference.']
],
refs:[['create_clock','Defines primary or virtual edge sequence.'],['create_generated_clock','Defines derived clock with master relationship.'],['Source latency','Delay before the clock definition point.'],['Network latency','Delay through on-chip clock distribution.']]
},
constraints:{
number:'05',title:'Constraint definition',accent:'Describe the real environment.',color:'#ff78b8',time:'45-55 min',level:'Interface contracts → exceptions',
deck:'Build complete SDC intent for clocks, boundaries, drivers, loads, design rules, modes and exceptions—then learn how to detect the silent failures of under-constraint.',
objectives:['Translate external interface timing into -min/-max input and output delays','Model electrical boundary conditions and design-rule validity','Choose among case analysis, false path, disable timing and explicit min/max delay'],
map:['I/O timing','Electrical','Modes','Exceptions'],
sections:[
S('SDC is an executable timing specification','Constraints define the world around a netlist and decide which relationships are meaningful.',
['A complete timing environment specifies clocks, external launch/capture behavior, boundary electrical conditions, design-rule limits and operating modes. Exceptions modify default edge/path relationships. Commands operate on collections; an empty get_ports or overly broad wildcard can silently under- or over-constrain the design.','Constraint work therefore includes intent plus validation. Count matched objects, report ignored/overridden constraints, inspect unconstrained paths and review exceptions against architecture. SDC syntax accepted by the tool is not proof that the intended objects were affected.'],
['Temporal constraints: clocks, I/O delay, min/max, multicycle.','Electrical constraints: driver, transition, load, max transition/cap/fanout.','Logical constraints: case analysis, false paths, disabled arcs.'],
'constraint correctness = intended relationship × correct object collection × correct precedence',
'set IN_PORTS [get_ports {DIN[*]}]\nputs "constrained inputs: [sizeof_collection $IN_PORTS]"',
'Treat every wildcard as a query whose result must be reviewed.'),
S('Input delay is the external launch path','The value at an input port represents timing accumulated before data enters the design.',
['set_input_delay -max models the latest external arrival, typically external clock-to-Q plus board/package delay and margin. -min models the earliest arrival. The reference clock may be physical or virtual. If both rise/fall or multiple clocks matter, use appropriate options and -add_delay rather than overwriting an existing constraint.','Input delay does not include the internal path from the input port onward. The first internal cell also needs input transition or a driving cell so its delay table is selected realistically. Constraining only -max can make setup plausible while leaving hold optimistic.'],
['-max participates in late/setup analysis.','-min participates in early/hold analysis.','Clock latency convention determines whether source/board delay belongs in clock or data values.'],
'input_delay,max ≈ tC2Q,ext,max + tboard,data,max − chosen clock reference adjustment',
'set_input_delay -clock VIO -max 2.7 [get_ports DIN]\nset_input_delay -clock VIO -min 0.4 [get_ports DIN]',
'Document what each numerical delay contains; otherwise board delay and clock latency are easily counted twice.'),
S('Output delay is an external capture requirement','The output constraint reserves time beyond the design boundary.',
['set_output_delay -max behaves like external data flight plus receiver setup: it moves the internal required time earlier. -min represents the external hold relationship and may be negative depending on sign convention and interface timing. A virtual clock often cleanly represents the external capture device.','Output load is separate from output delay. set_load changes electrical delay/slew of the final internal cell; set_output_delay changes when data must be available. Confusing the two creates either an electrically unrealistic path or a missing temporal contract.'],
['-max reserves time for downstream setup path.','-min describes downstream hold requirement.','set_load models capacitance, not time.'],
'RATout,setup = capture reference − output_delay,max',
'set_output_delay -clock VIO -max 3.2 [get_ports DOUT]\nset_output_delay -clock VIO -min -0.6 [get_ports DOUT]\nset_load 0.08 [get_ports DOUT]',
'Negative output -min values can be valid; derive the sign from the external waveform rather than copying a template.'),
S('Electrical context protects model validity','Boundary slews and loads determine which characterized region STA uses.',
['set_driving_cell models a real external cell, including its output slew as a function of load and potentially external delay. set_input_transition directly declares slew. Outputs require capacitance or an equivalent receiving model. Avoid specifying contradictory driver and transition assumptions unless tool semantics are deliberate.','Maximum transition, capacitance and fanout constraints are design-rule checks. Violations threaten signal integrity and library-table validity even when setup/hold slack is positive. A slow transition also increases short-circuit power and downstream delay sensitivity.'],
['Driver/transition defines the first internal arc input slew.','Output load defines the final driver electrical burden.','Design rules keep operation inside characterized limits.'],
'delaycell = LUT(slewin, Cload); model trust falls outside indexed/legal region',
'set_driving_cell -lib_cell INVX2 [get_ports DIN]\nset_load 0.08 [all_outputs]\nset_max_transition 0.30 [current_design]',
'A timing-clean design with transition violations is not timing-signoff clean.'),
S('Modes: case analysis versus arc removal','Select feasible behavior with the least destructive mechanism.',
['set_case_analysis fixes a port or pin to 0/1 (and tool-specific transition states), propagating constants through logic and disabling conditional library arcs that cannot activate. It is ideal for functional versus scan mode and clock-mux selection because it expresses mode behavior.','set_disable_timing removes a named cell arc regardless of logic condition, segmenting every path that needs it. It should be rare and narrowly reviewed. A false path leaves arcs in place but excludes selected path checks. Case analysis usually has stronger semantic grounding than deleting arcs manually.'],
['Case analysis: “this control is constant in this mode.”','Disable timing: “this specific library arc must never be traversed.”','False path: “this start/through/end relationship is not timed.”'],
'prefer logical mode constraints → targeted path exceptions → arc disable only when justified',
'set_case_analysis 0 [get_ports SCAN_MODE]\nset_disable_timing -from S -to Z [get_cells UMUX0]',
'Disabling an arc can remove more paths than the engineer who wrote the command intended.'),
S('Exceptions and precedence','Exceptions rewrite default path/edge analysis and therefore demand proof.',
['set_false_path excludes a path set from timing. set_max_delay/set_min_delay impose point-to-point bounds that can override normal clock-based relationships while cell setup/hold still participates according to tool semantics. set_multicycle_path moves launch/capture edge relationships; its hold companion must be specified correctly.','Broad false paths between asynchronous clock groups can be appropriate for synchronizers, but CDC correctness is a separate verification problem. Exception precedence and overlap matter: a false path can hide a max-delay intent, and a through collection can explode path coverage. Report exceptions and sample expanded paths.'],
['Every exception needs architectural rationale, owner and review.','Check startpoints/endpoints/through points actually matched.','Use dedicated CDC verification for asynchronous correctness.'],
'exception safety = narrow scope + valid reason + reported coverage + precedence review',
'set_false_path -through [get_pins UMUX/I0]\nset_max_delay 1.2 -from [get_clocks SYS] -to [get_clocks CFG]',
'An exception does not make a path safe; it only tells STA not to apply its ordinary check.')
],
labTitle:'Constraint coverage debugger',labIntro:'Assemble an interface/mode scenario. The debugger scores temporal, electrical and exception coverage and generates the minimal SDC skeleton while exposing missing assumptions.',
quiz:[
['What does set_load change?',['Electrical loading and final-cell delay/slew','The output capture edge','The logic function'],0,'Load selects electrical behavior; output delay specifies time.'],
['Which command best expresses “scan mode is disabled in functional analysis”?',['set_case_analysis','set_max_delay','set_clock_transition'],0,'Case analysis propagates the functional mode constant.'],
['Why constrain both input -min and -max?',['To cover early/hold and late/setup arrivals','To double the period','To create two ports'],0,'The external path has both earliest and latest possible timing.']
],
refs:[['set_input_delay','External launch timing at an input port.'],['set_output_delay','External capture requirement at an output port.'],['set_case_analysis','Mode constant that prunes infeasible behavior.'],['set_false_path','Path relationship intentionally excluded from timing checks.']]
},
checks:{
number:'06',title:'Timing checks',accent:'Protect the sampling window.',color:'#ff684a',time:'45-55 min',level:'Sequential physics → check arcs',
deck:'Understand how setup/hold form inside a cell, why values can be negative, how edge pairing works, and how recovery/removal, pulse-width, gating and data checks protect other failure modes.',
objectives:['Derive setup and hold slack from explicit launch/capture events','Explain negative library check values using internal pin delays','Select correct checks for multicycle, half-cycle, async, pulse and gating behavior'],
map:['Setup/hold','Edge pairing','Async/pulse','Gating/data'],
sections:[
S('Setup and hold protect an internal sampling event','External pin timing is a proxy for transistor-level stability around the cell’s sensitive instant.',
['Setup time is the minimum interval data must be stable before the active clock edge; hold is the minimum after. At transistor level, clock and data travel through different internal paths to a pass gate or storage node. Violating the window can increase clock-to-Q delay, create metastability or capture the wrong value.','Liberty usually stores setup/hold as 2-D tables indexed by related clock transition and constrained data transition. Some cells add output load as a third dimension when internal behavior remains load-sensitive. Separate rising/falling constraints model transition polarity.'],
['Reference pin: typically clock.','Constrained pin: data or control.','Thresholds define the external crossing used to measure the check.'],
'stable interval around edge = [tclock − tsetup, tclock + thold]',
'timing_type: setup_rising / hold_rising\nvariable_1: related_pin_transition\nvariable_2: constrained_pin_transition',
'Setup/hold are not universal constants for a cell; they depend on waveform conditions.'),
S('Negative values are physically possible','External pins are not the transistor pins where contention actually occurs.',
['Suppose the clock takes 3 ps to reach the internal gate, data takes 6 ps, and internal hold is 2 ps. External data may begin changing 1 ps before the external clock edge yet still arrive at the internal point 2 ps after the internal clock. The characterized external hold value is therefore −1 ps.','Negative setup/hold does not mean the cell has no requirement. It means internal relative delays shift the requirement across the external reference edge. Setup and hold also trade against clock-to-Q; characterization methodology chooses points on a constraint surface, not isolated constants.'],
['Internal data delay can relax external hold.','Internal clock delay can relax external setup or tighten hold.','Values must be used with the characterized clock/data slews.'],
'thold,ext = thold,int + tclk,int − tdata,int',
'2 ps + 3 ps − 6 ps = −1 ps external hold',
'Do not clamp a negative library constraint to zero; that discards characterized behavior and adds uncontrolled pessimism.'),
S('Edge pairing defines the real requirement','The same check value can produce different constraints depending on which clock events are paired.',
['For same-clock positive-edge registers, setup normally compares launch edge n to capture edge n+1. Hold compares the new data launched at edge n against capture edge n. For clocks with different periods/phases, tools expand edges over a least-common repeating interval and choose the most restrictive legal pairs.','Half-cycle paths launch and capture on opposite polarity edges, so duty cycle directly limits setup budget and can also affect the hold relationship. Generated clocks preserve the phase information needed to pair edges correctly.'],
['Setup seeks the nearest capture edge after a legal launch.','Hold protects the capture event against the next data change.','Clock phase, waveform and latency all enter edge time.'],
'setup slack = tcapture − setup − uncertainty − tarrival',
'launch rise @0 → capture rise @T (full cycle)\nlaunch rise @0 → capture fall @duty·T (half cycle)',
'Before debugging “too little logic budget,” verify the launch/capture edge pair printed in the report.'),
S('Multicycle paths move edges, not delays','A multicycle constraint changes the temporal relationship; it does not make gates faster.',
['If architecture guarantees data is sampled after N cycles, set_multicycle_path -setup N moves the setup capture edge. By default, the hold engine follows the edge preceding that moved setup edge, which may incorrectly require old data to remain stable for extra cycles. The common paired command -hold N−1 moves hold back to the intended first edge.','Multicycle is valid only when launch/capture enables or protocol behavior truly enforce the multi-cycle relationship. It is not a repair for a slow ordinary path. Apply it to the exact endpoints and verify reports for both setup and hold.'],
['Setup N grants N periods between launch and capture.','Hold N−1 usually restores the original hold edge.','Enable logic and functional proof must justify the path.'],
'setup MCP N ↔ hold MCP N−1 (common same-clock convention)',
'set_multicycle_path -setup 2 -from SRC -to DST\nset_multicycle_path -hold  1 -from SRC -to DST',
'The most dangerous multicycle bug is a setup improvement accompanied by a newly over-constrained or under-constrained hold check.'),
S('Asynchronous and waveform checks','Not every failure is a data setup/hold failure.',
['Recovery requires an asynchronous set/reset control to become inactive sufficiently before the next active clock edge; removal requires it to remain stable after the edge. They are async analogues of setup and hold. Assertion is often asynchronous, but deassertion must be timed to avoid metastability.','Minimum pulse width protects high and low phases long enough for sequential circuits to recognize them. Unequal rise/fall delay, variation, aging and gating can shrink a pulse. Reports compare propagated edge separation at the pin against library or explicit min-pulse constraints.'],
['Recovery: inactive before clock.','Removal: inactive transition held away after clock.','Pulse width: high/low duration at a clock/control pin.'],
'pulse_high,out = pulse_high,in + dfall − drise',
'set_min_pulse_width 0.50 [get_clocks CLK]\nreport_min_pulse_width',
'A perfect period does not guarantee safe duty cycle; rise/fall asymmetry can violate pulse width.'),
S('Clock gating and data-to-data checks','Some controls must remain stable during a sensitive phase rather than around a flip-flop edge.',
['For active-high AND/NAND gating, enable is allowed to change while clock is low and must be stable around the rising/active window. Active-low OR/NOR gating reverses the safe phase. Libraries can supply gating setup/hold arcs; set_clock_gating_check supplies explicit margins. Violations can create shortened or extra pulses.','set_data_check creates setup/hold-like relations between arbitrary data pins. The related pin acts like a clock reference and the constrained pin like data. Setup is often a zero-cycle relationship on the same event, useful for protocols whose pins must arrive in a defined order.'],
['Integrated clock-gating cells contain latch behavior to hold enable safely.','Combinational ad hoc clock gates require careful checks.','Data checks express relative pin timing not captured by ordinary paths.'],
'gating safety = enable stable throughout clock gate sensitive window',
'set_clock_gating_check -setup 0.10 -hold 0.05 [get_clocks CLK]\nset_data_check -from A1 -to A2 -setup 1.8',
'A gating violation can be functional even when every register data path has positive slack.')
],
labTitle:'Sampling-window & check selector',labIntro:'Move data and control events around a clock edge, switch check families, and see which forbidden window is created and why.',
quiz:[

['A setup multicycle of 3 commonly pairs with hold…',['2','3','0 always'],0,'The N−1 hold adjustment returns hold to the intended earlier edge.'],
['Which check protects asynchronous reset deassertion before a clock?',['Recovery','Pulse width high','Output delay'],0,'Recovery is the setup-like async-control release check.']
],
refs:[['Setup / hold','Data stable before / after active sampling edge.'],['Recovery / removal','Async release before / after clock edge.'],['Min pulse width','Minimum recognizable high or low phase.'],['Gating check','Enable stability preventing malformed clock pulses.']]
